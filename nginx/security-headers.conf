# Cabeceras de seguridad (§16.2). Se incluye en cada location porque add_header en un location
# anula los heredados. El hash es el sha256 del script de tema en línea (src/lib/theme-init.ts):
# se recalcula con `npm run build && node scripts/csp-hash.mjs --write`.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-DY5wqlASD1WVLWMUbdlcl1zK9YSYPaXOg0iGej/CiRs='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
